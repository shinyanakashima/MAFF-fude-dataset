<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAFF筆ポリゴン ビューア</title>
</head>

<body>
  <div id="map"></div>
  <!-- ローディングスピナー -->
  <div id="loading-ui" class="absolute inset-0 z-50 flex items-center justify-center bg-white/70 hidden"
    aria-label="読み込み中">
    <div class="animate-spin h-12 w-12 border-4 border-blue-500 border-t-transparent rounded-full"></div>
  </div>
  <!-- 表示範囲が広すぎる場合や取得上限に達した場合の案内 -->
  <div id="hint-ui"
    class="absolute bottom-8 left-1/2 -translate-x-1/2 z-40 rounded bg-black/70 px-3 py-2 text-sm text-white hidden"
    role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
