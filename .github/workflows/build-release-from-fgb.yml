# R2上のFGBから統合ファイル（GeoJSON / NDJSON / TopoJSON）を生成し、
# GitHub Releaseへ添付するワークフロー。
#
# 年度×県ごとに1リリース（タグ v<YEAR>-<PREF>）とし、3形式をまとめて添付する。
# 既にタグが存在する場合は資産を上書きする（再実行で更新できる）。
#
# 事前設定 (Settings > Secrets and variables > Actions):
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT
#
# 入力: geo-opendata/maff-fude/fgb/<year>/<pref>/fude_<year>_<pref>.fgb
# 出力: Release v<year>-<pref>
#   ├─ fude_<year>_<pref>.geojson   … 統合GeoJSON
#   ├─ fude_<year>_<pref>.ndjson    … 統合NDJSON (GeoJSONSeq)
#   ├─ fude_<year>_<pref>.topojson  … 統合TopoJSON (簡略化済み)
#   └─ SHA256SUMS.txt
name: Build Release from FGB

on:
  workflow_dispatch:
    inputs:
      year:
        description: "年度 (例: 2025)"
        required: true
        default: "2025"
      prefs:
        description: '都道府県コード。カンマ区切り (例: "01") または "all" で01〜47'
        required: true
        default: "01"
      simplify:
        description: "TopoJSONの簡略化率(%)。保持する頂点の割合"
        required: false
        default: "10"

permissions:
  contents: write

env:
  BUCKET: geo-opendata
  DATASET: maff-fude

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prefs: ${{ steps.expand.outputs.prefs }}
    steps:
      - id: expand
        run: |
          if [ "${{ inputs.prefs }}" = "all" ]; then
            list=$(seq -w 1 47 | paste -sd, -)
          else
            list="${{ inputs.prefs }}"
          fi
          json=$(echo "$list" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -E '^[0-9]{2}$' \
                 | jq -R . | jq -sc .)
          echo "prefs=$json" >> "$GITHUB_OUTPUT"
          echo "対象: $json"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # TopoJSON生成がメモリを大きく使うため直列実行する
      max-parallel: 1
      matrix:
        pref: ${{ fromJson(needs.prepare.outputs.prefs) }}
    steps:
      - name: ディスク空き容量を確保
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: false

      - name: ツール導入 (GDAL / rclone / mapshaper)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin
          curl -fsSL https://rclone.org/install.sh | sudo bash
          npm install -g mapshaper
          ogr2ogr --version && mapshaper --version && gh --version | head -1

      - name: FGB取得 → 3形式を生成
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          YEAR="${{ inputs.year }}"; PREF="${{ matrix.pref }}"
          BASE="fude_${YEAR}_${PREF}"
          SRC="r2:${BUCKET}/${DATASET}/fgb/${YEAR}/${PREF}/${BASE}.fgb"

          if ! rclone lsf "$SRC" >/dev/null 2>&1; then
            echo "::warning::FGBが存在しないためスキップ: ${YEAR}/${PREF}"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::group::FGB ダウンロード"
          rclone copyto --stats 30s --stats-one-line "$SRC" fude.fgb
          ls -lh fude.fgb
          echo "::endgroup::"

          echo "::group::FGB → NDJSON"
          ogr2ogr -f GeoJSONSeq "${BASE}.ndjson" fude.fgb
          rm -f fude.fgb
          echo "features: $(wc -l < "${BASE}.ndjson")"
          echo "::endgroup::"

          echo "::group::NDJSON → GeoJSON (ストリームで包む)"
          { printf '{"type":"FeatureCollection","features":[\n'
            awk 'NR>1{printf ",\n"} {printf "%s", $0}' "${BASE}.ndjson"
            printf '\n]}\n'
          } > "${BASE}.geojson"
          ls -lh "${BASE}.geojson"
          echo "::endgroup::"

          echo "::group::GeoJSON → TopoJSON (mapshaper)"
          # 北海道(81万件・1.2GB)の実測: ピーク7.9GB・約4分。ランナー(16GB)で余裕がある。
          # 万一メモリ不足で失敗した場合は簡略化率を半分に下げて1回だけ再試行する。
          export NODE_OPTIONS="--max-old-space-size=12288"
          SIMPLIFY="${{ inputs.simplify }}"
          convert() {
            # レイヤー名は年度非依存の固定名 fude にする(タイルと同じ方針)
            mapshaper "${BASE}.geojson" \
              -filter-fields polygon_uuid,land_type,local_government_cd \
              -rename-layers fude \
              -simplify "$1%" \
              -o format=topojson "${BASE}.topojson"
          }
          if ! convert "$SIMPLIFY"; then
            RETRY=$(( SIMPLIFY / 2 )); [ "$RETRY" -lt 1 ] && RETRY=1
            echo "::warning::simplify=${SIMPLIFY}% で失敗。${RETRY}% で再試行します"
            convert "$RETRY"
          fi
          ls -lh "${BASE}.topojson"
          echo "::endgroup::"

          sha256sum "${BASE}.geojson" "${BASE}.ndjson" "${BASE}.topojson" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Releaseへ添付
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          YEAR="${{ inputs.year }}"; PREF="${{ matrix.pref }}"
          BASE="fude_${YEAR}_${PREF}"
          TAG="v${YEAR}-${PREF}"
          FILES=("${BASE}.geojson" "${BASE}.ndjson" "${BASE}.topojson" "SHA256SUMS.txt")

          printf '%s\n' \
            "R2上のFGBから生成した統合ファイル。" \
            "" \
            "| ファイル | 内容 |" \
            "| --- | --- |" \
            "| \`${BASE}.geojson\` | 統合GeoJSON |" \
            "| \`${BASE}.ndjson\` | 統合NDJSON (GeoJSONSeq) |" \
            "| \`${BASE}.topojson\` | 統合TopoJSON (simplify ${{ inputs.simplify }}%) |" \
            "" \
            "出典: 「筆ポリゴンデータ」（農林水産省）を加工して作成" > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "既存のリリース ${TAG} に上書きします"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "${YEAR}年度 統合ファイル（都道府県コード ${PREF}）" \
              --notes-file notes.md
          fi
          echo "✅ ${TAG} 完了"
