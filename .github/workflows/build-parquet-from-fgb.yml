# R2上のFGBから解析用のGeoParquetを生成し、R2へ戻すワークフロー。
#
# 元データ(農水省の配布物)を再取得する必要がなく、R2のFGBだけで完結する。
# 生成物はDuckDBから直接クエリできる（bbox列を埋め込み済み）。
#
# 事前設定 (Settings > Secrets and variables > Actions):
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT
#
# 入出力キー:
#   in : geo-opendata/maff-fude/fgb/<year>/<pref>/fude_<year>_<pref>.fgb
#   out: geo-opendata/maff-fude/parquet/<year>/<pref>/fude_<year>_<pref>.parquet
name: Build Parquet from FGB

on:
  workflow_dispatch:
    inputs:
      year:
        description: "年度 (例: 2026)"
        required: true
        default: "2026"
      prefs:
        description: '都道府県コード。カンマ区切り (例: "01,13") または "all" で01〜47'
        required: true
        default: "01"

env:
  BUCKET: geo-opendata
  DATASET: maff-fude
  DUCKDB_VERSION: v1.1.3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prefs: ${{ steps.expand.outputs.prefs }}
    steps:
      - id: expand
        run: |
          if [ "${{ inputs.prefs }}" = "all" ]; then
            list=$(seq -w 1 47 | paste -sd, -)
          else
            list="${{ inputs.prefs }}"
          fi
          json=$(echo "$list" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -E '^[0-9]{2}$' \
                 | jq -R . | jq -sc .)
          echo "prefs=$json" >> "$GITHUB_OUTPUT"
          echo "対象: $json"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pref: ${{ fromJson(needs.prepare.outputs.prefs) }}
    steps:
      - name: ツール導入 (DuckDB / rclone)
        run: |
          curl -fsSL -o duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/ && sudo chmod +x /usr/local/bin/duckdb
          curl -fsSL https://rclone.org/install.sh | sudo bash
          duckdb -c "INSTALL spatial;" && duckdb --version

      - name: FGB を取得 → Parquet を生成 → R2 へ配置
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # バケット作成権限を持たないスコープ付きトークンで必要
          RCLONE_S3_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          YEAR="${{ inputs.year }}"; PREF="${{ matrix.pref }}"
          SRC="r2:${BUCKET}/${DATASET}/fgb/${YEAR}/${PREF}/fude_${YEAR}_${PREF}.fgb"
          OUT="fude_${YEAR}_${PREF}.parquet"
          DST="r2:${BUCKET}/${DATASET}/parquet/${YEAR}/${PREF}/${OUT}"

          if ! rclone lsf "$SRC" >/dev/null 2>&1; then
            echo "::warning::FGBが存在しないためスキップ: ${YEAR}/${PREF}"
            exit 0
          fi

          echo "::group::FGB ダウンロード"
          rclone copyto --stats 30s --stats-one-line "$SRC" fude.fgb
          ls -lh fude.fgb
          echo "::endgroup::"

          echo "::group::FGB → GeoParquet"
          # ジオメトリはWKBで格納し、bbox列を併せて持たせる。
          # DuckDBはrow groupのmin/max統計でbbox/年度/県の絞り込みを高速化できるため、
          # Hiveパーティションに頼らずカラムだけで実用的なプルーニングが効く。
          cat > conv.sql <<SQL
          LOAD spatial;
          COPY (
            SELECT
              polygon_uuid, land_type, issue_year, edit_year,
              local_government_cd, point_lng, point_lat, history,
              last_polygon_uuid, prev_last_polygon_uuid,
              CAST(${YEAR} AS INTEGER) AS year,
              '${PREF}' AS pref,
              ST_AsWKB(geom) AS geometry,
              ST_XMin(geom) AS min_lng, ST_YMin(geom) AS min_lat,
              ST_XMax(geom) AS max_lng, ST_YMax(geom) AS max_lat
            FROM ST_Read('fude.fgb')
          ) TO '${OUT}' (FORMAT PARQUET, COMPRESSION ZSTD);
          SQL
          duckdb -c ".read conv.sql"
          rm -f fude.fgb
          ls -lh "$OUT"
          duckdb -c "SELECT count(*) AS features FROM '${OUT}';"
          echo "::endgroup::"

          echo "::group::R2 へアップロード"
          rclone copyto --stats 30s --stats-one-line "$OUT" "$DST"
          echo "::endgroup::"

          local_size=$(stat -c%s "$OUT")
          remote_size=$(rclone size "$DST" --json | sed 's/.*"bytes":\([0-9]*\).*/\1/')
          if [ "$local_size" != "$remote_size" ]; then
            echo "::error::サイズ不一致 local=${local_size} remote=${remote_size}"
            exit 1
          fi
          echo "✅ ${YEAR}/${PREF} 完了 (${local_size} バイト)"
